[package]
name = "sahayak-edge"
version = "0.1.0"
description = "Offline-first AI memory for frontline health workers"
edition = "2024"

[lib]
name = "sahayak_edge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qdrant-edge = "0.8.0"
ureq = "3"
tempfile = "3"
tauri-plugin-voice = { path = "plugins/voice" }
tauri-plugin-geolocation = "2"

# Debug info is most of the build size; the phone build does not need it.
[profile.dev]
debug = 0

# Debug APKs still get an optimised Qdrant Edge, so on-phone search stays fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
strip = true
lto = "thin"
codegen-units = 4
