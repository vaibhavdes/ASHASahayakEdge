[package]
name = "tauri-plugin-voice"
version = "0.1.0"
description = "On-device speech-to-text for Sahayak Edge (Android SpeechRecognizer, offline)"
edition = "2021"
links = "tauri-plugin-voice"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
