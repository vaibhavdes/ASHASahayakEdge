name: Android APK

# Builds the arm64 APK and publishes it on this repository's Releases page.
#   push to main   -> "Latest build" pre-release (replaced on every push)
#   tag v*         -> a permanent release for that version
#   manual run     -> same as push to main
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "data/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write # needed to create releases and upload the APK

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Icons and Android project
        run: |
          npx tauri icon app-icon.png
          [ -d src-tauri/gen/android ] || npx tauri android init --ci

      - name: Build APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
          VITE_CLOUD_URL: ${{ vars.CLOUD_URL }}
        # A debug build is signed with the standard debug key, so it installs on any phone directly.
        run: npx tauri android build --apk --target aarch64 --debug --ci

      - name: Name the APK
        id: apk
        run: |
          src=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$src" ]; then echo "No APK produced"; exit 1; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then label="${GITHUB_REF_NAME}"; else label="$(git rev-parse --short HEAD)"; fi
          out="$RUNNER_TEMP/sahayak-edge-${label}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$out" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "Sahayak Edge $GITHUB_REF_NAME" \
            --notes "Android APK (arm64, ${{ steps.apk.outputs.size }}). Install it directly on the phone; allow installs from this source when Android asks." \
            --verify-tag

      - name: Publish latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build "${{ steps.apk.outputs.path }}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Built automatically from \`$(git rev-parse --short HEAD)\` on $(date -u '+%d %b %Y %H:%M UTC'). Android APK (arm64, ${{ steps.apk.outputs.size }}). Install it directly on the phone."

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: sahayak-edge-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
