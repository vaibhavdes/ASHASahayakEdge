name: Android APK

# Tauri generates the Android Gradle project during CI; there is no root gradlew.
# PRs build an APK, main publishes a replaceable preview, and v* tags publish releases.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "data/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "data/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Current Tauri generates compileSdk 37; the voice plugin uses API 35.
          "$sdkmanager" --install "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006"
          ndk_home="$ANDROID_HOME/ndk/27.1.12297006"
          test -d "$ndk_home"
          echo "NDK_HOME=$ndk_home" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Generate icons and Android project
        run: |
          npx tauri icon app-icon.png
          npx tauri android init --ci

      - name: Build installable arm64 APK
        # A debug APK uses Android's debug signing key; release signing is not configured.
        env:
          VITE_CLOUD_URL: https://sahayak-cloud-362605925833.asia-south1.run.app
        run: npx tauri android build --apk --target aarch64 --debug --ci

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          apk_dir=src-tauri/gen/android/app/build/outputs/apk
          mapfile -t apks < <(find "$apk_dir" -type f -name '*debug*.apk' | sort)
          if (( ${#apks[@]} != 1 )); then
            printf 'Expected one debug APK, found %s:\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-apk"
          cp "${apks[0]}" "$RUNNER_TEMP/android-apk/sahayak-edge-arm64.apk"
          ls -lh "$RUNNER_TEMP/android-apk/sahayak-edge-arm64.apk"

      - name: Keep APK with workflow run
        uses: actions/upload-artifact@v7
        with:
          name: sahayak-edge-arm64-apk
          path: ${{ runner.temp }}/android-apk/sahayak-edge-arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: sahayak-edge-arm64-apk
          path: android-apk

      - name: Publish version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" android-apk/sahayak-edge-arm64.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" android-apk/sahayak-edge-arm64.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sahayak Edge $GITHUB_REF_NAME" \
              --notes "Installable arm64 Android debug APK. Allow installs from this source when Android asks." \
              --verify-tag
          fi

      - name: Publish latest main build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest-build android-apk/sahayak-edge-arm64.apk \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest build (${GITHUB_SHA:0:7})" \
            --notes "Installable arm64 Android debug APK from commit $GITHUB_SHA."
